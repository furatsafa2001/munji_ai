<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .t  { fill:#1a1a1a; font-size:13px; }
      .ts { fill:#555;    font-size:11px; }
      .tb { fill:#1a1a1a; font-size:13px; font-weight:600; }
      .tt { fill:#1a1a1a; font-size:17px; font-weight:600; }
      .tw { fill:#ffffff; font-size:12px; font-weight:600; }
      .box { stroke:#1a1a1a; stroke-width:1.2; }
      .ln  { stroke:#1a1a1a; stroke-width:1.2; fill:none; marker-end:url(#arr); }
    </style>
  </defs>

  <rect width="1180" height="760" fill="#ffffff"/>
  <text x="40" y="38" class="tt">ShockableNet — 1D CNN for shockable-rhythm detection</text>
  <text x="40" y="58" class="ts">Input: one 5 s window of single-lead ECG at 250 Hz  ·  Output: P(shockable)  ·  172,498 trainable parameters</text>

  <!-- INPUT -->
  <rect x="40" y="100" width="150" height="56" rx="6" fill="#F0EEE6" class="box"/>
  <text x="115" y="123" text-anchor="middle" class="tb">Input</text>
  <text x="115" y="141" text-anchor="middle" class="ts">1 × 1250</text>
  <line x1="190" y1="128" x2="222" y2="128" class="ln"/>

  <!-- BLOCKS -->
  <g id="b1">
    <rect x="224" y="86" width="150" height="84" rx="6" fill="#DDEEDD" class="box"/>
    <text x="299" y="106" text-anchor="middle" class="tb">ConvBlock 1</text>
    <text x="299" y="123" text-anchor="middle" class="ts">Conv1d 1→16, k=7, d=1</text>
    <text x="299" y="138" text-anchor="middle" class="ts">BN · GELU · Pool 2 · Drop</text>
    <text x="299" y="158" text-anchor="middle" class="t">16 × 625</text>
    <text x="299" y="186" text-anchor="middle" class="ts">144 params</text>
  </g>
  <line x1="374" y1="128" x2="406" y2="128" class="ln"/>

  <g id="b2">
    <rect x="408" y="86" width="150" height="84" rx="6" fill="#CFE6CF" class="box"/>
    <text x="483" y="106" text-anchor="middle" class="tb">ConvBlock 2</text>
    <text x="483" y="123" text-anchor="middle" class="ts">Conv1d 16→32, k=7, d=1</text>
    <text x="483" y="138" text-anchor="middle" class="ts">BN · GELU · Pool 2 · Drop</text>
    <text x="483" y="158" text-anchor="middle" class="t">32 × 312</text>
    <text x="483" y="186" text-anchor="middle" class="ts">3,648 params</text>
  </g>
  <line x1="558" y1="128" x2="590" y2="128" class="ln"/>

  <g id="b3">
    <rect x="592" y="86" width="150" height="84" rx="6" fill="#BFDDBF" class="box"/>
    <text x="667" y="106" text-anchor="middle" class="tb">ConvBlock 3</text>
    <text x="667" y="123" text-anchor="middle" class="ts">Conv1d 32→64, k=7, d=2</text>
    <text x="667" y="138" text-anchor="middle" class="ts">BN · GELU · Pool 2 · Drop</text>
    <text x="667" y="158" text-anchor="middle" class="t">64 × 156</text>
    <text x="667" y="186" text-anchor="middle" class="ts">14,464 params</text>
  </g>
  <line x1="742" y1="128" x2="774" y2="128" class="ln"/>

  <g id="b4">
    <rect x="776" y="86" width="150" height="84" rx="6" fill="#AFD4AF" class="box"/>
    <text x="851" y="106" text-anchor="middle" class="tb">ConvBlock 4</text>
    <text x="851" y="123" text-anchor="middle" class="ts">Conv1d 64→96, k=7, d=4</text>
    <text x="851" y="138" text-anchor="middle" class="ts">BN · GELU · Pool 2 · Drop</text>
    <text x="851" y="158" text-anchor="middle" class="t">96 × 78</text>
    <text x="851" y="186" text-anchor="middle" class="ts">43,200 params</text>
  </g>
  <line x1="926" y1="128" x2="958" y2="128" class="ln"/>

  <g id="b5">
    <rect x="960" y="86" width="150" height="84" rx="6" fill="#9FCB9F" class="box"/>
    <text x="1035" y="106" text-anchor="middle" class="tb">ConvBlock 5</text>
    <text x="1035" y="123" text-anchor="middle" class="ts" font-size="10.5px">Conv1d 96→128, k=7, d=8</text>
    <text x="1035" y="138" text-anchor="middle" class="ts">BN · GELU · Pool 2 · Drop</text>
    <text x="1035" y="158" text-anchor="middle" class="t">128 × 39</text>
    <text x="1035" y="186" text-anchor="middle" class="ts">86,272 params</text>
  </g>

  <!-- receptive field note -->
  <text x="224" y="214" class="ts">Dilation doubles from block 3 on, so the receptive field at block 5 spans roughly 1.6 s of signal — several beats — without adding parameters.</text>

  <!-- down arrow from b5 -->
  <path d="M 1035 170 L 1035 250 L 590 250 L 590 282" class="ln"/>

  <!-- GLOBAL POOL -->
  <rect x="440" y="284" width="300" height="72" rx="6" fill="#E8E0F0" class="box"/>
  <text x="590" y="306" text-anchor="middle" class="tb">Global statistics pooling</text>
  <text x="590" y="324" text-anchor="middle" class="ts">mean(t)  ‖  max(t)  ‖  std(t)   over the 39 time steps</text>
  <text x="590" y="344" text-anchor="middle" class="t">128 × 3 = 384</text>
  <text x="760" y="320" class="ts">std is the irregularity channel:</text>
  <text x="760" y="335" class="ts">regular rhythm → spiky, high variance</text>
  <text x="760" y="350" class="ts">fibrillation → continuous, low variance</text>
  <line x1="590" y1="356" x2="590" y2="388" class="ln"/>

  <!-- HEAD -->
  <rect x="440" y="390" width="300" height="56" rx="6" fill="#F4E6D0" class="box"/>
  <text x="590" y="412" text-anchor="middle" class="tb">Linear 384 → 64</text>
  <text x="590" y="430" text-anchor="middle" class="ts">GELU · Dropout 0.1    ·    24,640 params</text>
  <line x1="590" y1="446" x2="590" y2="478" class="ln"/>

  <rect x="440" y="480" width="300" height="56" rx="6" fill="#F4E6D0" class="box"/>
  <text x="590" y="502" text-anchor="middle" class="tb">Linear 64 → 2</text>
  <text x="590" y="520" text-anchor="middle" class="ts">logits [not_shockable, shockable]    ·    130 params</text>
  <line x1="590" y1="536" x2="590" y2="568" class="ln"/>

  <!-- OUTPUT -->
  <rect x="440" y="570" width="300" height="62" rx="6" fill="#1D9E75" class="box"/>
  <text x="590" y="592" text-anchor="middle" class="tw">Softmax → P(shockable)</text>
  <text x="590" y="608" text-anchor="middle" fill="#ffffff" font-size="11px">threshold 0.50, then 2-of-3 window</text>
  <text x="590" y="621" text-anchor="middle" fill="#ffffff" font-size="11px">confirmation before any alarm</text>

  <!-- TRAINING SIDEBAR -->
  <rect x="40" y="284" width="340" height="342" rx="6" fill="#F7F7F5" stroke="#B4B2A9" stroke-width="1"/>
  <text x="60" y="310" class="tb">Training</text>
  <text x="60" y="334" class="ts">Loss        focal cross-entropy, γ = 2.0</text>
  <text x="60" y="350" class="ts">            + miss penalty 2.5 on false negatives</text>
  <text x="60" y="366" class="ts">            + label smoothing 0.05</text>
  <text x="60" y="382" class="ts">            + inverse-frequency class weights</text>
  <text x="60" y="406" class="ts">Optimiser   AdamW, lr 3e-3, weight decay 1e-4</text>
  <text x="60" y="422" class="ts">Schedule    OneCycleLR</text>
  <text x="60" y="438" class="ts">Batch       128    Epochs  25    Grad clip 1.0</text>
  <text x="60" y="462" class="ts">Selection   max specificity subject to</text>
  <text x="60" y="478" class="ts">            sensitivity ≥ 0.90  (AHA/AAMI floor)</text>
  <text x="60" y="502" class="ts">Validation  5-fold cross-validation,</text>
  <text x="60" y="518" class="ts">            folds grouped by patient,</text>
  <text x="60" y="534" class="ts">            test split never read</text>
  <text x="60" y="558" class="tb">Parameter budget</text>
  <text x="60" y="578" class="ts">Conv stack   147,728</text>
  <text x="60" y="594" class="ts">Head          24,770</text>
  <text x="60" y="610" class="ts">Total        172,498</text>

  <!-- footer -->
  <text x="40" y="690" class="ts">Every ConvBlock is Conv1d (no bias) → BatchNorm1d → GELU → MaxPool1d(2) → Dropout(0.1). Kernel 7 throughout. Time axis halves at each block: 1250 → 625 → 312 → 156 → 78 → 39.</text>
  <text x="40" y="708" class="ts">Parameter counts include BatchNorm affine terms. The network is sized to run beside three other models on a phone; dilation rather than depth widens what it can see.</text>
  <text x="40" y="738" class="ts">Munji AI · munji_ai/models/shockable_net.py</text>
</svg>
