<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 790" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .t  { fill:#1a1a1a; font-size:13px; }
      .ts { fill:#555;    font-size:10.5px; }
      .tb { fill:#1a1a1a; font-size:13px; font-weight:600; }
      .tt { fill:#1a1a1a; font-size:17px; font-weight:600; }
      .tw { fill:#ffffff; font-size:12px; font-weight:600; }
      .box { stroke:#1a1a1a; stroke-width:1.2; }
      .ln  { stroke:#1a1a1a; stroke-width:1.2; fill:none; marker-end:url(#arr); }
    </style>
  </defs>

  <rect width="1220" height="790" fill="#ffffff"/>
  <text x="40" y="38" class="tt">RhythmNet — 1D CNN for atrial fibrillation detection</text>
  <text x="40" y="58" class="ts">Input: one 30 s window of single-lead ECG at 250 Hz  ·  Output: P(NSR), P(AF), P(OTHER)  ·  337,875 trainable parameters</text>

  <!-- INPUT -->
  <rect x="40" y="100" width="128" height="56" rx="6" fill="#F0EEE6" class="box"/>
  <text x="104" y="123" text-anchor="middle" class="tb">Input</text>
  <text x="104" y="141" text-anchor="middle" class="ts">1 × 7500</text>
  <line x1="168" y1="128" x2="196" y2="128" class="ln"/>

  <!-- BLOCKS -->
  <g>
    <rect x="198" y="88" width="148" height="80" rx="6" fill="#E6F0E6" class="box"/>
    <text x="272" y="107" text-anchor="middle" class="tb">ConvBlock 1</text>
    <text x="272" y="123" text-anchor="middle" class="ts">1→16, k=7, d=1</text>
    <text x="272" y="138" text-anchor="middle" class="ts">BN · GELU · Pool 2</text>
    <text x="272" y="157" text-anchor="middle" class="t">16 × 3750</text>
    <text x="272" y="184" text-anchor="middle" class="ts">144</text>
  </g>
  <line x1="346" y1="128" x2="374" y2="128" class="ln"/>
  <g>
    <rect x="376" y="88" width="148" height="80" rx="6" fill="#DDEEDD" class="box"/>
    <text x="450" y="107" text-anchor="middle" class="tb">ConvBlock 2</text>
    <text x="450" y="123" text-anchor="middle" class="ts">16→32, k=7, d=2</text>
    <text x="450" y="138" text-anchor="middle" class="ts">BN · GELU · Pool 2</text>
    <text x="450" y="157" text-anchor="middle" class="t">32 × 1875</text>
    <text x="450" y="184" text-anchor="middle" class="ts">3,648</text>
  </g>
  <line x1="524" y1="128" x2="552" y2="128" class="ln"/>
  <g>
    <rect x="554" y="88" width="148" height="80" rx="6" fill="#D2E8D2" class="box"/>
    <text x="628" y="107" text-anchor="middle" class="tb">ConvBlock 3</text>
    <text x="628" y="123" text-anchor="middle" class="ts">32→64, k=7, d=4</text>
    <text x="628" y="138" text-anchor="middle" class="ts">BN · GELU · Pool 2</text>
    <text x="628" y="157" text-anchor="middle" class="t">64 × 937</text>
    <text x="628" y="184" text-anchor="middle" class="ts">14,464</text>
  </g>
  <line x1="702" y1="128" x2="730" y2="128" class="ln"/>
  <g>
    <rect x="732" y="88" width="148" height="80" rx="6" fill="#C6E1C6" class="box"/>
    <text x="806" y="107" text-anchor="middle" class="tb">ConvBlock 4</text>
    <text x="806" y="123" text-anchor="middle" class="ts">64→96, k=7, d=8</text>
    <text x="806" y="138" text-anchor="middle" class="ts">BN · GELU · Pool 2</text>
    <text x="806" y="157" text-anchor="middle" class="t">96 × 468</text>
    <text x="806" y="184" text-anchor="middle" class="ts">43,200</text>
  </g>
  <line x1="880" y1="128" x2="908" y2="128" class="ln"/>
  <g>
    <rect x="910" y="88" width="148" height="80" rx="6" fill="#B9DAB9" class="box"/>
    <text x="984" y="107" text-anchor="middle" class="tb">ConvBlock 5</text>
    <text x="984" y="123" text-anchor="middle" class="ts">96→128, k=7, d=16</text>
    <text x="984" y="138" text-anchor="middle" class="ts">BN · GELU · Pool 2</text>
    <text x="984" y="157" text-anchor="middle" class="t">128 × 234</text>
    <text x="984" y="184" text-anchor="middle" class="ts">86,272</text>
  </g>
  <path d="M 1058 128 L 1092 128 L 1092 210 L 1058 210" class="ln"/>
  <g>
    <rect x="910" y="214" width="148" height="80" rx="6" fill="#ACD3AC" class="box"/>
    <text x="984" y="233" text-anchor="middle" class="tb">ConvBlock 6</text>
    <text x="984" y="249" text-anchor="middle" class="ts">128→160, k=7, d=32</text>
    <text x="984" y="264" text-anchor="middle" class="ts">BN · GELU · Pool 2</text>
    <text x="984" y="283" text-anchor="middle" class="t">160 × 117</text>
    <text x="984" y="310" text-anchor="middle" class="ts">143,680</text>
  </g>

  <text x="198" y="212" class="ts">Dilation doubles at every block (1·2·4·8·16·32). After six halvings the time axis is 7500 → 117, and one activation at the deepest</text>
  <text x="198" y="228" class="ts">layer sees several seconds of trace — many beats, which is what judging rhythm irregularity requires.</text>

  <path d="M 910 254 L 640 254 L 640 300" class="ln"/>

  <!-- GLOBAL POOL -->
  <rect x="470" y="302" width="340" height="76" rx="6" fill="#E8E0F0" class="box"/>
  <text x="640" y="324" text-anchor="middle" class="tb">Global statistics pooling</text>
  <text x="640" y="342" text-anchor="middle" class="ts">mean(t)  ‖  max(t)  ‖  std(t)   over the 117 time steps</text>
  <text x="640" y="364" text-anchor="middle" class="t">160 × 3 = 480</text>
  <line x1="640" y1="378" x2="640" y2="406" class="ln"/>

  <!-- HEAD -->
  <rect x="470" y="408" width="340" height="54" rx="6" fill="#F4E6D0" class="box"/>
  <text x="640" y="429" text-anchor="middle" class="tb">Linear 480 → 96</text>
  <text x="640" y="447" text-anchor="middle" class="ts">GELU · Dropout 0.1    ·    46,176 params</text>
  <line x1="640" y1="462" x2="640" y2="490" class="ln"/>

  <rect x="470" y="492" width="340" height="54" rx="6" fill="#F4E6D0" class="box"/>
  <text x="640" y="513" text-anchor="middle" class="tb">Linear 96 → 3</text>
  <text x="640" y="531" text-anchor="middle" class="ts">logits [NSR, AF, OTHER]    ·    291 params</text>
  <line x1="640" y1="546" x2="640" y2="574" class="ln"/>

  <!-- OUTPUT -->
  <rect x="470" y="576" width="340" height="60" rx="6" fill="#1D9E75" class="box"/>
  <text x="640" y="598" text-anchor="middle" class="tw">Softmax → P(AF)</text>
  <text x="640" y="615" text-anchor="middle" fill="#ffffff" font-size="10.5px">threshold 0.50, then 2-of-3 window confirmation</text>
  <text x="640" y="629" text-anchor="middle" fill="#ffffff" font-size="10.5px">— about one minute of sustained AF before any alert</text>

  <!-- SIDEBAR: why std -->
  <rect x="846" y="302" width="334" height="156" rx="6" fill="#F7F7F5" stroke="#B4B2A9" stroke-width="1"/>
  <text x="866" y="326" class="tb">Why the std channel</text>
  <text x="866" y="348" class="ts">Atrial fibrillation is not a shape. It is the</text>
  <text x="866" y="364" class="ts">absence of regularity: no P wave, and beat</text>
  <text x="866" y="380" class="ts">spacing that follows no pattern.</text>
  <text x="866" y="402" class="ts">Regular rhythm → evenly spaced activations,</text>
  <text x="866" y="418" class="ts">low variance. Fibrillation → uneven, high</text>
  <text x="866" y="434" class="ts">variance. Irregularity measured directly,</text>
  <text x="866" y="450" class="ts">with no beat detector to fail under motion.</text>

  <!-- SIDEBAR: training -->
  <rect x="40" y="302" width="400" height="334" rx="6" fill="#F7F7F5" stroke="#B4B2A9" stroke-width="1"/>
  <text x="60" y="326" class="tb">Training</text>
  <text x="60" y="350" class="ts">Loss        focal cross-entropy, γ = 2.0</text>
  <text x="60" y="366" class="ts">            + AF miss penalty 1.3</text>
  <text x="60" y="382" class="ts">            + label smoothing 0.05</text>
  <text x="60" y="398" class="ts">            + class weights, capped at 4.0</text>
  <text x="60" y="422" class="ts">Optimiser   AdamW, lr 2e-3, weight decay 1e-4</text>
  <text x="60" y="438" class="ts">Schedule    OneCycleLR</text>
  <text x="60" y="454" class="ts">Batch       64    Epochs  30    Grad clip 1.0</text>
  <text x="60" y="478" class="ts">Selection   max macro F1 over NSR and AF</text>
  <text x="60" y="494" class="ts">Validation  5-fold cross-validation,</text>
  <text x="60" y="510" class="ts">            folds grouped by patient,</text>
  <text x="60" y="526" class="ts">            test split never read</text>
  <text x="60" y="552" class="tb">Parameter budget</text>
  <text x="60" y="574" class="ts">Conv stack   291,408</text>
  <text x="60" y="590" class="ts">Head          46,467</text>
  <text x="60" y="606" class="ts">Total        337,875</text>
  <text x="60" y="628" class="ts">1.3 MB float32 · 330 KB int8</text>

  <!-- footer -->
  <text x="40" y="690" class="ts">Every ConvBlock is Conv1d (no bias) → BatchNorm1d → GELU → MaxPool1d(2) → Dropout(0.1). Kernel 7 throughout.</text>
  <text x="40" y="708" class="ts">Six blocks rather than five, and dilation to 32 rather than 8, because the window is six times longer than the shockable detector's.</text>
  <text x="40" y="726" class="ts">The miss penalty is 1.3 against that model's 2.5: missing fibrillation is a death in minutes, missing atrial fibrillation is a stroke risk over months.</text>
  <text x="40" y="762" class="ts">Munji AI · munji_ai/models/rhythm_net.py</text>
</svg>
